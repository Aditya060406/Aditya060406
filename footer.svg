<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 125" width="100%" height="100%">
  <defs>
    <linearGradient id="spaceFooterBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#010A0A" />
      <stop offset="50%" stop-color="#031716" />
      <stop offset="100%" stop-color="#021919" />
    </linearGradient>

    <radialGradient id="spaceFooterGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0C969C" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#010A0A" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="miniPlanetGlow" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#E8F6F8" />
      <stop offset="50%" stop-color="#6BA3BE" />
      <stop offset="100%" stop-color="#0A7075" />
    </radialGradient>

    <linearGradient id="meteorTailFooter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#0C969C" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0C969C" stop-opacity="0" />
    </linearGradient>

    <style>
      @keyframes twinkleFooter {
        0%, 100% { opacity: 0.25; transform: scale(0.9); }
        50% { opacity: 0.95; transform: scale(1.2); }
      }
      @keyframes meteorFooter {
        0% { transform: translate(120px, -40px); opacity: 0; }
        20% { opacity: 1; }
        50% { transform: translate(-160px, 80px); opacity: 0; }
        100% { transform: translate(-160px, 80px); opacity: 0; }
      }
      @keyframes cursorBlinkFooter {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .twinkle-f1 { animation: twinkleFooter 3.5s ease-in-out infinite; }
      .twinkle-f2 { animation: twinkleFooter 4.2s ease-in-out infinite 1.5s; }
      .meteor-f { animation: meteorFooter 6.5s ease-in infinite; }
      .cursor-blink-f { animation: cursorBlinkFooter 1.05s infinite; }
      .mono-text { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, Menlo, Monaco, monospace; }
      .sans-text { font-family: 'Outfit', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Deep Space Canvas -->
  <rect width="950" height="125" rx="16" fill="url(#spaceFooterBg)" />
  <rect width="950" height="125" rx="16" fill="url(#spaceFooterGlow)" />

  <!-- Stars in Footer -->
  <g fill="#E8F6F8">
    <g class="twinkle-f1">
      <circle cx="95" cy="35" r="1.3" opacity="0.8" />
      <circle cx="240" cy="85" r="1" opacity="0.6" />
      <circle cx="390" cy="25" r="1.4" opacity="0.85" />
      <circle cx="680" cy="95" r="1.2" opacity="0.75" />
      <circle cx="850" cy="40" r="1.5" opacity="0.9" />
    </g>
    <g class="twinkle-f2">
      <circle cx="160" cy="90" r="1.1" opacity="0.7" />
      <circle cx="310" cy="40" r="1.5" opacity="0.8" />
      <circle cx="580" cy="20" r="1.2" opacity="0.7" />
      <circle cx="760" cy="80" r="1.6" opacity="0.85" />
      <circle cx="905" cy="95" r="1" opacity="0.6" />
    </g>
  </g>

  <!-- Shooting Star in Footer -->
  <g class="meteor-f">
    <line x1="880" y1="15" x2="800" y2="65" stroke="url(#meteorTailFooter)" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="880" cy="15" r="2" fill="#FFFFFF" />
  </g>

  <!-- Left Celestial Crescent Moon -->
  <g transform="translate(45, 38)">
    <circle cx="22" cy="22" r="16" fill="#021415" stroke="#0A7075" stroke-width="0.6" stroke-opacity="0.5" />
    <path d="M 22 6 A 16 16 0 0 1 38 22 A 16 16 0 0 1 22 38 A 16 16 0 0 0 32 22 A 16 16 0 0 0 22 6 Z" fill="#E8F6F8" />
    <circle cx="22" cy="22" r="25" fill="#0C969C" fill-opacity="0.12" />
  </g>

  <!-- Right Ringed Exoplanet -->
  <g transform="translate(875, 62)">
    <ellipse cx="0" cy="0" rx="34" ry="11" transform="rotate(-18)" fill="none" stroke="#6BA3BE" stroke-width="2" stroke-opacity="0.6" />
    <circle cx="0" cy="0" r="15" fill="url(#miniPlanetGlow)" />
    <ellipse cx="0" cy="0" rx="34" ry="11" transform="rotate(-18)" fill="none" stroke="#E8F6F8" stroke-width="1.2" stroke-opacity="0.85" stroke-dasharray="25,50" />
  </g>

  <!-- Center Content -->
  <g transform="translate(475, 42)" text-anchor="middle">
    <!-- Telemetry Command Line -->
    <text y="0" class="mono-text" font-size="12" font-weight="600" fill="#6BA3BE" letter-spacing="1">
      <tspan fill="#0C969C">❯ </tspan>trajectory: <tspan fill="#94E2D5">"DEEP_SPACE_VOYAGE"</tspan> <tspan fill="#0C969C">//</tspan> next: <tspan fill="#E8F6F8">EXCEPTIONAL_SOFTWARE</tspan>
      <tspan class="cursor-blink-f" fill="#0C969C"> █</tspan>
    </text>

    <!-- Main Heading -->
    <text y="34" class="sans-text" font-size="20" font-weight="800" fill="#E8F6F8" letter-spacing="0.5">
      LET'S BUILD SOMETHING EXCEPTIONAL!
    </text>

    <!-- Subtitle -->
    <text y="56" class="mono-text" font-size="10.5" font-weight="600" fill="#6BA3BE" letter-spacing="1">
      [ SOFTWARE ENGINEER // FULL-STACK ARCHITECT // OPEN FOR COLLABORATION ]
    </text>
  </g>
</svg>

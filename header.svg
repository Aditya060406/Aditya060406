<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 220" width="100%" height="100%">
  <defs>
    <!-- Deep Space Gradients -->
    <linearGradient id="spaceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#010A0A" />
      <stop offset="35%" stop-color="#031716" />
      <stop offset="70%" stop-color="#021919" />
      <stop offset="100%" stop-color="#010D0D" />
    </linearGradient>

    <!-- Cosmic Nebula Glowing Dust -->
    <radialGradient id="nebulaCyan" cx="75%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#0C969C" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#0A7075" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#010A0A" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="nebulaMist" cx="20%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#6BA3BE" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#032F30" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#010A0A" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="planetGlow" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#E8F6F8" />
      <stop offset="35%" stop-color="#6BA3BE" />
      <stop offset="70%" stop-color="#0A7075" />
      <stop offset="100%" stop-color="#031716" />
    </radialGradient>

    <radialGradient id="moonGlow" cx="40%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E8F6F8" />
      <stop offset="75%" stop-color="#6BA3BE" />
      <stop offset="100%" stop-color="#0A7075" />
    </radialGradient>

    <radialGradient id="moonCorona" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0C969C" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#6BA3BE" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0C969C" stop-opacity="0" />
    </radialGradient>

    <!-- Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C969C" stop-opacity="0.1" />
      <stop offset="30%" stop-color="#6BA3BE" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#E8F6F8" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0A7075" stop-opacity="0.15" />
    </linearGradient>

    <!-- Shooting Star Meteor Gradient -->
    <linearGradient id="meteorTail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8F6F8" stop-opacity="1" />
      <stop offset="40%" stop-color="#0C969C" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0C969C" stop-opacity="0" />
    </linearGradient>

    <!-- Text Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E8F6F8" />
      <stop offset="75%" stop-color="#6BA3BE" />
      <stop offset="100%" stop-color="#0C969C" />
    </linearGradient>

    <style>
      @keyframes twinkle {
        0%, 100% { opacity: 0.3; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1.2); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-4px) rotate(1deg); }
      }
      @keyframes meteorShoot {
        0% { transform: translate(160px, -60px); opacity: 0; }
        15% { opacity: 1; }
        45% { transform: translate(-220px, 120px); opacity: 0; }
        100% { transform: translate(-220px, 120px); opacity: 0; }
      }
      @keyframes pulseBeacon {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.35); opacity: 0.35; }
      }
      .star-twinkle-1 { animation: twinkle 3.2s ease-in-out infinite; }
      .star-twinkle-2 { animation: twinkle 4.5s ease-in-out infinite 1.2s; }
      .star-twinkle-3 { animation: twinkle 2.8s ease-in-out infinite 0.7s; }
      .meteor-anim { animation: meteorShoot 6.5s ease-in infinite; }
      .planet-float { animation: floatSlow 6s ease-in-out infinite; }
      .pulse-beacon { animation: pulseBeacon 2s ease-in-out infinite; transform-origin: 48px 18px; }
      .mono-text { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, Menlo, Monaco, monospace; }
      .sans-text { font-family: 'Outfit', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Deep Space Canvas -->
  <rect width="950" height="220" rx="18" fill="url(#spaceBg)" stroke="#0A7075" stroke-width="1.2" stroke-opacity="0.35" />

  <!-- Cosmic Nebulae -->
  <rect width="950" height="220" rx="18" fill="url(#nebulaCyan)" />
  <rect width="950" height="220" rx="18" fill="url(#nebulaMist)" />

  <!-- Starfield (Stars, Constellations & Celestial Points) -->
  <g fill="#E8F6F8">
    <!-- Star Group 1 -->
    <g class="star-twinkle-1">
      <circle cx="95" cy="45" r="1.2" opacity="0.8" />
      <circle cx="160" cy="95" r="1" opacity="0.6" />
      <circle cx="280" cy="38" r="1.5" opacity="0.9" />
      <circle cx="430" cy="85" r="1" opacity="0.7" />
      <circle cx="560" cy="42" r="1.4" opacity="0.8" />
      <circle cx="690" cy="90" r="1.2" opacity="0.75" />
      <circle cx="780" cy="35" r="1.6" opacity="0.9" />
      <circle cx="910" cy="110" r="1.1" opacity="0.7" />
      <circle cx="340" cy="195" r="1.3" opacity="0.8" />
      <circle cx="720" cy="195" r="1.2" opacity="0.7" />
    </g>

    <!-- Star Group 2 -->
    <g class="star-twinkle-2">
      <circle cx="55" cy="110" r="1.5" opacity="0.7" />
      <circle cx="210" cy="60" r="1.2" opacity="0.8" />
      <circle cx="360" cy="90" r="0.9" opacity="0.6" />
      <circle cx="490" cy="38" r="1.7" opacity="0.85" />
      <circle cx="620" cy="75" r="1" opacity="0.7" />
      <circle cx="730" cy="68" r="1.3" opacity="0.8" />
      <circle cx="880" cy="45" r="1.5" opacity="0.75" />
      <circle cx="120" cy="180" r="1.1" opacity="0.65" />
      <circle cx="520" cy="185" r="1.4" opacity="0.85" />
    </g>

    <!-- Star Group 3 (Bright 4-Point Sparkle Crosses) -->
    <g class="star-twinkle-3">
      <!-- 4-point sparkle at (240, 38) -->
      <path d="M 240 32 L 241 37 L 246 38 L 241 39 L 240 44 L 239 39 L 234 38 L 239 37 Z" fill="#6BA3BE" opacity="0.85" />
      <!-- 4-point sparkle at (660, 32) -->
      <path d="M 660 26 L 661 31 L 666 32 L 661 33 L 660 38 L 659 33 L 654 32 L 659 31 Z" fill="#0C969C" opacity="0.9" />
      <!-- 4-point sparkle at (915, 65) -->
      <path d="M 915 60 L 916 64 L 920 65 L 916 66 L 915 70 L 914 66 L 910 65 L 914 64 Z" fill="#E8F6F8" opacity="0.95" />
    </g>
  </g>

  <!-- Constellation Geometric Lines -->
  <g stroke="#6BA3BE" stroke-width="0.6" stroke-opacity="0.22" fill="none">
    <polyline points="160,95 210,60 240,38 280,38" />
    <polyline points="660,32 690,90 730,68 780,35" />
  </g>

  <!-- Shooting Star Meteor with Fading Trail -->
  <g class="meteor-anim">
    <line x1="750" y1="25" x2="650" y2="85" stroke="url(#meteorTail)" stroke-width="2" stroke-linecap="round" />
    <circle cx="750" cy="25" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- ================= CELESTIAL BODIES ================= -->

  <!-- 1. Glowing Crescent Moon with Corona (Left Celestial Side) -->
  <g transform="translate(42, 42)">
    <!-- Moon Corona Halo -->
    <circle cx="28" cy="28" r="38" fill="url(#moonCorona)" />
    <!-- Moon Full Orb Base (Dark side with faint starlight) -->
    <circle cx="28" cy="28" r="22" fill="#032021" fill-opacity="0.75" stroke="#0A7075" stroke-width="0.7" stroke-opacity="0.4" />
    <!-- Lunar Craters (Faint on dark side) -->
    <circle cx="22" cy="24" r="3.2" fill="#031716" fill-opacity="0.8" />
    <circle cx="31" cy="34" r="2.2" fill="#031716" fill-opacity="0.8" />
    <circle cx="34" cy="21" r="2.8" fill="#031716" fill-opacity="0.8" />
    <!-- Glowing Luminous Crescent Shape -->
    <path d="M 28 6 A 22 22 0 0 1 50 28 A 22 22 0 0 1 28 50 A 22 22 0 0 0 42 28 A 22 22 0 0 0 28 6 Z" fill="url(#moonGlow)" />
  </g>

  <!-- 2. Orbiting Exoplanet with Rings (Right Celestial Side) -->
  <g class="planet-float" transform="translate(845, 68)">
    <!-- Outer Orbit Telemetry Track -->
    <ellipse cx="0" cy="0" rx="60" ry="22" transform="rotate(-20)" fill="none" stroke="#0C969C" stroke-width="0.8" stroke-dasharray="3,4" stroke-opacity="0.4" />

    <!-- Back Planetary Ring (Behind planet body) -->
    <g transform="rotate(-20)">
      <path d="M -54 0 A 54 16 0 0 1 54 0" fill="none" stroke="url(#ringGrad)" stroke-width="4.5" stroke-opacity="0.65" />
      <path d="M -46 0 A 46 13 0 0 1 46 0" fill="none" stroke="#6BA3BE" stroke-width="1.6" stroke-opacity="0.5" />
    </g>

    <!-- Planet 3D Sphere -->
    <circle cx="0" cy="0" r="24" fill="url(#planetGlow)" />

    <!-- Planetary Atmospheric Cloud Bands -->
    <path d="M -22 3 Q 0 10 22 3" fill="none" stroke="#031716" stroke-width="2.2" stroke-opacity="0.4" />
    <path d="M -23 -5 Q 0 2 23 -5" fill="none" stroke="#6BA3BE" stroke-width="1.3" stroke-opacity="0.4" />

    <!-- Front Planetary Ring (In front of planet body) -->
    <g transform="rotate(-20)">
      <path d="M 54 0 A 54 16 0 0 1 -54 0" fill="none" stroke="url(#ringGrad)" stroke-width="4.5" stroke-opacity="0.95" />
      <path d="M 46 0 A 46 13 0 0 1 -46 0" fill="none" stroke="#E8F6F8" stroke-width="1.6" stroke-opacity="0.85" />
    </g>

    <!-- Tiny Orbiting Moonlet / Satellite -->
    <circle cx="42" cy="-20" r="2.5" fill="#E8F6F8" />
    <circle cx="42" cy="-20" r="4.5" fill="#0C969C" fill-opacity="0.3" />
  </g>

  <!-- 3. Distant Tiny Celestial Orb (Center-Top) -->
  <g transform="translate(530, 32)">
    <circle cx="0" cy="0" r="4" fill="#6BA3BE" />
    <circle cx="0" cy="0" r="8" fill="#0C969C" fill-opacity="0.25" />
    <ellipse cx="0" cy="0" rx="10" ry="3.5" transform="rotate(35)" fill="none" stroke="#6BA3BE" stroke-width="0.6" stroke-opacity="0.5" />
  </g>

  <!-- ================= TOP STATUS STRIP (NO TRAFFIC LIGHTS) ================= -->
  <g transform="translate(42, 16)">
    <!-- Pulsing Cyan Beacon (Oceanic Theme) -->
    <circle cx="6" cy="6" r="4" fill="#0C969C" class="pulse-beacon" />
    <circle cx="6" cy="6" r="2" fill="#E8F6F8" />

    <!-- Clean Tech Breadcrumb -->
    <text x="22" y="10" class="mono-text" font-size="11" font-weight="600" fill="#6BA3BE" letter-spacing="0.8">
      ADITYA PANIGRAHI // GITHUB PROFILE <tspan fill="#0C969C">[ONLINE]</tspan>
    </text>

    <!-- Right Telemetry Badge -->
    <g transform="translate(710, -5)">
      <rect width="156" height="22" rx="11" fill="#032F30" fill-opacity="0.75" stroke="#0C969C" stroke-width="0.8" stroke-opacity="0.5" />
      <circle cx="16" cy="11" r="3" fill="#0C969C" />
      <text x="28" y="15" class="mono-text" font-size="9.5" font-weight="700" fill="#E8F6F8" letter-spacing="0.8">SYS_STATUS: NOMINAL</text>
    </g>
  </g>

  <!-- Clean Subtle Line -->
  <line x1="42" y1="38" x2="908" y2="38" stroke="#0A7075" stroke-opacity="0.3" stroke-width="0.8" />

  <!-- ================= DEVELOPER TITLE & EMBLEM ================= -->
  <g transform="translate(132, 58)">
    <!-- High-Tech Cosmic Emblem -->
    <g transform="translate(0, 0)">
      <rect width="66" height="66" rx="16" fill="#032F30" fill-opacity="0.75" stroke="#0C969C" stroke-width="1.2" stroke-opacity="0.8" />
      <rect x="4" y="4" width="58" height="58" rx="12" fill="#021514" fill-opacity="0.9" />
      <!-- Planetary Orbit behind monogram -->
      <ellipse cx="33" cy="33" rx="30" ry="11" transform="rotate(-30 33 33)" fill="none" stroke="#6BA3BE" stroke-width="0.8" stroke-dasharray="2,3" stroke-opacity="0.7" />
      <text x="33" y="41" text-anchor="middle" class="mono-text" font-size="20" font-weight="800" fill="#0C969C">&lt;AP/&gt;</text>
    </g>

    <!-- Developer Name -->
    <text x="86" y="38" class="sans-text" font-size="36" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5">
      ADITYA PANIGRAHI
    </text>

    <!-- Role Subtitle -->
    <text x="88" y="62" class="mono-text" font-size="12" font-weight="600" fill="#6BA3BE" letter-spacing="1.2">
      SOFTWARE ENGINEER <tspan fill="#0C969C">//</tspan> FULL-STACK DEVELOPER <tspan fill="#0C969C">//</tspan> SYSTEMS &amp; C++
    </text>
  </g>

  <!-- ================= TELEMETRY CHIPS STRIP ================= -->
  <g transform="translate(42, 160)">
    <!-- Chip 1: Architecture -->
    <g transform="translate(0, 0)">
      <rect width="186" height="30" rx="8" fill="#032F30" fill-opacity="0.6" stroke="#0A7075" stroke-width="0.8" stroke-opacity="0.5" />
      <text x="93" y="19" text-anchor="middle" class="mono-text" font-size="10.5" font-weight="600" fill="#E8F6F8" letter-spacing="0.5">
        SYSTEM ARCHITECTURE
      </text>
    </g>

    <!-- Chip 2: Algorithms -->
    <g transform="translate(198, 0)">
      <rect width="176" height="30" rx="8" fill="#032F30" fill-opacity="0.6" stroke="#0A7075" stroke-width="0.8" stroke-opacity="0.5" />
      <text x="88" y="19" text-anchor="middle" class="mono-text" font-size="10.5" font-weight="600" fill="#E8F6F8" letter-spacing="0.5">
        C++ &amp; ALGORITHMS
      </text>
    </g>

    <!-- Chip 3: Full Stack -->
    <g transform="translate(386, 0)">
      <rect width="190" height="30" rx="8" fill="#032F30" fill-opacity="0.6" stroke="#0A7075" stroke-width="0.8" stroke-opacity="0.5" />
      <text x="95" y="19" text-anchor="middle" class="mono-text" font-size="10.5" font-weight="600" fill="#E8F6F8" letter-spacing="0.5">
        FULL-STACK PLATFORMS
      </text>
    </g>

    <!-- Chip 4: API & DB Design -->
    <g transform="translate(588, 0)">
      <rect width="170" height="30" rx="8" fill="#032F30" fill-opacity="0.6" stroke="#0A7075" stroke-width="0.8" stroke-opacity="0.5" />
      <text x="85" y="19" text-anchor="middle" class="mono-text" font-size="10.5" font-weight="600" fill="#E8F6F8" letter-spacing="0.5">
        API &amp; DATABASE DESIGN
      </text>
    </g>

    <!-- Chip 5: Status -->
    <g transform="translate(770, 0)">
      <rect width="96" height="30" rx="8" fill="#032F30" fill-opacity="0.6" stroke="#0C969C" stroke-width="0.9" stroke-opacity="0.8" />
      <text x="48" y="19" text-anchor="middle" class="mono-text" font-size="10.5" font-weight="700" fill="#0C969C" letter-spacing="0.6">
        ONLINE ➔
      </text>
    </g>
  </g>
</svg>

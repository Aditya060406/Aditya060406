<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 340" width="100%" height="100%">
  <defs>
    <!-- Deep Space Gradients -->
    <linearGradient id="spaceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#010A0A" />
      <stop offset="35%" stop-color="#031716" />
      <stop offset="70%" stop-color="#021919" />
      <stop offset="100%" stop-color="#010D0D" />
    </linearGradient>

    <!-- Cosmic Nebula Glowing Dust -->
    <radialGradient id="nebulaCyan" cx="75%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#0C969C" stop-opacity="0.28" />
      <stop offset="45%" stop-color="#0A7075" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#010A0A" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="nebulaMist" cx="20%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#6BA3BE" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#032F30" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#010A0A" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="planetGlow" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#E8F6F8" />
      <stop offset="35%" stop-color="#6BA3BE" />
      <stop offset="70%" stop-color="#0A7075" />
      <stop offset="100%" stop-color="#031716" />
    </radialGradient>

    <radialGradient id="moonGlow" cx="40%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E8F6F8" />
      <stop offset="75%" stop-color="#6BA3BE" />
      <stop offset="100%" stop-color="#0A7075" />
    </radialGradient>

    <radialGradient id="moonCorona" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0C969C" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#6BA3BE" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0C969C" stop-opacity="0" />
    </radialGradient>

    <!-- Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C969C" stop-opacity="0.1" />
      <stop offset="30%" stop-color="#6BA3BE" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#E8F6F8" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0A7075" stop-opacity="0.15" />
    </linearGradient>

    <!-- Shooting Star Meteor Gradient -->
    <linearGradient id="meteorTail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8F6F8" stop-opacity="1" />
      <stop offset="40%" stop-color="#0C969C" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0C969C" stop-opacity="0" />
    </linearGradient>

    <!-- Text Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E8F6F8" />
      <stop offset="75%" stop-color="#6BA3BE" />
      <stop offset="100%" stop-color="#0C969C" />
    </linearGradient>

    <style>
      @keyframes twinkle {
        0%, 100% { opacity: 0.3; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1.2); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-4px) rotate(1deg); }
      }
      @keyframes meteorShoot {
        0% { transform: translate(180px, -80px); opacity: 0; }
        15% { opacity: 1; }
        45% { transform: translate(-250px, 150px); opacity: 0; }
        100% { transform: translate(-250px, 150px); opacity: 0; }
      }
      @keyframes orbitSatellite {
        0% { transform: rotate(0deg) translateX(55px) rotate(0deg); }
        100% { transform: rotate(360deg) translateX(55px) rotate(-360deg); }
      }
      @keyframes cursorBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes pulseBeacon {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.35); opacity: 0.35; }
      }
      .star-twinkle-1 { animation: twinkle 3.2s ease-in-out infinite; }
      .star-twinkle-2 { animation: twinkle 4.5s ease-in-out infinite 1.2s; }
      .star-twinkle-3 { animation: twinkle 2.8s ease-in-out infinite 0.7s; }
      .meteor-anim { animation: meteorShoot 7s ease-in infinite; }
      .planet-float { animation: floatSlow 6s ease-in-out infinite; }
      .cursor-blink { animation: cursorBlink 1.05s infinite; }
      .pulse-beacon { animation: pulseBeacon 2s ease-in-out infinite; }
      .mono-text { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, Menlo, Monaco, monospace; }
      .sans-text { font-family: 'Outfit', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Deep Space Canvas -->
  <rect width="950" height="340" rx="18" fill="url(#spaceBg)" />

  <!-- Cosmic Nebulae -->
  <rect width="950" height="340" rx="18" fill="url(#nebulaCyan)" />
  <rect width="950" height="340" rx="18" fill="url(#nebulaMist)" />

  <!-- Starfield (Stars, Constellations & Celestial Points) -->
  <g fill="#E8F6F8">
    <!-- Star Group 1 -->
    <g class="star-twinkle-1">
      <circle cx="85" cy="55" r="1.2" opacity="0.8" />
      <circle cx="160" cy="115" r="1" opacity="0.6" />
      <circle cx="280" cy="48" r="1.5" opacity="0.9" />
      <circle cx="420" cy="95" r="1" opacity="0.7" />
      <circle cx="560" cy="62" r="1.4" opacity="0.8" />
      <circle cx="690" cy="110" r="1.2" opacity="0.75" />
      <circle cx="780" cy="45" r="1.6" opacity="0.9" />
      <circle cx="910" cy="130" r="1.1" opacity="0.7" />
      <circle cx="340" cy="305" r="1.3" opacity="0.8" />
      <circle cx="720" cy="315" r="1.2" opacity="0.7" />
    </g>

    <!-- Star Group 2 -->
    <g class="star-twinkle-2">
      <circle cx="45" cy="120" r="1.5" opacity="0.7" />
      <circle cx="210" cy="70" r="1.2" opacity="0.8" />
      <circle cx="350" cy="110" r="0.9" opacity="0.6" />
      <circle cx="490" cy="48" r="1.7" opacity="0.85" />
      <circle cx="620" cy="95" r="1" opacity="0.7" />
      <circle cx="730" cy="78" r="1.3" opacity="0.8" />
      <circle cx="880" cy="60" r="1.5" opacity="0.75" />
      <circle cx="120" cy="310" r="1.1" opacity="0.65" />
      <circle cx="520" cy="320" r="1.4" opacity="0.85" />
    </g>

    <!-- Star Group 3 (Bright 4-Point Sparkle Crosses) -->
    <g class="star-twinkle-3">
      <!-- 4-point sparkle at (240, 50) -->
      <path d="M 240 44 L 241 49 L 246 50 L 241 51 L 240 56 L 239 51 L 234 50 L 239 49 Z" fill="#6BA3BE" opacity="0.85" />
      <!-- 4-point sparkle at (660, 42) -->
      <path d="M 660 36 L 661 41 L 666 42 L 661 43 L 660 48 L 659 43 L 654 42 L 659 41 Z" fill="#0C969C" opacity="0.9" />
      <!-- 4-point sparkle at (915, 85) -->
      <path d="M 915 80 L 916 84 L 920 85 L 916 86 L 915 90 L 914 86 L 910 85 L 914 84 Z" fill="#E8F6F8" opacity="0.95" />
      <!-- 4-point sparkle at (55, 90) -->
      <path d="M 55 86 L 56 89 L 59 90 L 56 91 L 55 94 L 54 91 L 51 90 L 54 89 Z" fill="#6BA3BE" opacity="0.8" />
    </g>
  </g>

  <!-- Constellation Geometric Lines -->
  <g stroke="#6BA3BE" stroke-width="0.6" stroke-opacity="0.22" fill="none">
    <polyline points="160,115 210,70 240,50 280,48" />
    <polyline points="660,42 690,110 730,78 780,45" />
  </g>

  <!-- Shooting Star Meteor with Fading Trail -->
  <g class="meteor-anim">
    <line x1="780" y1="35" x2="680" y2="95" stroke="url(#meteorTail)" stroke-width="2" stroke-linecap="round" />
    <circle cx="780" cy="35" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- ================= CELESTIAL BODIES ================= -->

  <!-- 1. Glowing Crescent Moon with Corona (Left Celestial Corner) -->
  <g transform="translate(48, 62)">
    <!-- Moon Corona Halo -->
    <circle cx="28" cy="28" r="38" fill="url(#moonCorona)" />
    <!-- Moon Full Orb Base (Dark side with faint starlight) -->
    <circle cx="28" cy="28" r="20" fill="#032021" fill-opacity="0.7" stroke="#0A7075" stroke-width="0.6" stroke-opacity="0.4" />
    <!-- Lunar Craters (Faint on dark side) -->
    <circle cx="22" cy="24" r="3.2" fill="#031716" fill-opacity="0.8" />
    <circle cx="31" cy="34" r="2.2" fill="#031716" fill-opacity="0.8" />
    <circle cx="34" cy="21" r="2.8" fill="#031716" fill-opacity="0.8" />
    <!-- Glowing Luminous Crescent Shape -->
    <path d="M 28 8 A 20 20 0 0 1 48 28 A 20 20 0 0 1 28 48 A 20 20 0 0 0 40 28 A 20 20 0 0 0 28 8 Z" fill="url(#moonGlow)" />
  </g>

  <!-- 2. Orbiting Exoplanet with Rings (Right Celestial Corner) -->
  <g class="planet-float" transform="translate(835, 92)">
    <!-- Outer Orbit Telemetry Track -->
    <ellipse cx="0" cy="0" rx="64" ry="24" transform="rotate(-20)" fill="none" stroke="#0C969C" stroke-width="0.8" stroke-dasharray="3,4" stroke-opacity="0.4" />

    <!-- Back Planetary Ring (Behind planet body) -->
    <g transform="rotate(-20)">
      <path d="M -58 0 A 58 18 0 0 1 58 0" fill="none" stroke="url(#ringGrad)" stroke-width="5" stroke-opacity="0.65" />
      <path d="M -50 0 A 50 14 0 0 1 50 0" fill="none" stroke="#6BA3BE" stroke-width="1.8" stroke-opacity="0.5" />
    </g>

    <!-- Planet 3D Sphere -->
    <circle cx="0" cy="0" r="26" fill="url(#planetGlow)" />

    <!-- Planetary Atmospheric Cloud Bands -->
    <path d="M -24 3 Q 0 12 24 3" fill="none" stroke="#031716" stroke-width="2.5" stroke-opacity="0.4" />
    <path d="M -25 -6 Q 0 2 25 -6" fill="none" stroke="#6BA3BE" stroke-width="1.5" stroke-opacity="0.4" />

    <!-- Front Planetary Ring (In front of planet body) -->
    <g transform="rotate(-20)">
      <path d="M 58 0 A 58 18 0 0 1 -58 0" fill="none" stroke="url(#ringGrad)" stroke-width="5" stroke-opacity="0.95" />
      <path d="M 50 0 A 50 14 0 0 1 -50 0" fill="none" stroke="#E8F6F8" stroke-width="1.8" stroke-opacity="0.85" />
    </g>

    <!-- Tiny Orbiting Moonlet / Satellite -->
    <circle cx="44" cy="-22" r="2.8" fill="#E8F6F8" />
    <circle cx="44" cy="-22" r="5" fill="#0C969C" fill-opacity="0.3" />
  </g>

  <!-- 3. Distant Tiny Celestial Orb (Center-Top) -->
  <g transform="translate(485, 48)">
    <circle cx="0" cy="0" r="4.5" fill="#6BA3BE" />
    <circle cx="0" cy="0" r="9" fill="#0C969C" fill-opacity="0.25" />
    <ellipse cx="0" cy="0" rx="12" ry="4" transform="rotate(35)" fill="none" stroke="#6BA3BE" stroke-width="0.6" stroke-opacity="0.5" />
  </g>

  <!-- ================= MISSION CONTROL TERMINAL BAR ================= -->
  <!-- Top Glass Terminal Bar -->
  <rect x="0" y="0" width="950" height="42" rx="18" fill="#021414" fill-opacity="0.8" />
  <rect x="0" y="32" width="950" height="10" fill="#021414" fill-opacity="0.8" />
  <line x1="0" y1="42" x2="950" y2="42" stroke="#0A7075" stroke-opacity="0.3" stroke-width="1" />

  <!-- Window Traffic Lights (Mission Control Style) -->
  <circle cx="28" cy="21" r="5.5" fill="#FF5F56" />
  <circle cx="46" cy="21" r="5.5" fill="#FFBD2E" />
  <circle cx="64" cy="21" r="5.5" fill="#27C93F" />

  <!-- Terminal Mission Path -->
  <text x="92" y="26" class="mono-text" font-size="12" font-weight="600" fill="#6BA3BE" fill-opacity="0.9" letter-spacing="0.5">
    aditya@space-station: ~/cosmos/orbit-01 <tspan fill="#0C969C">(mission_active)</tspan>
  </text>

  <!-- Telemetry Beacon Pill (Right Header) -->
  <rect x="760" y="10" width="166" height="23" rx="11.5" fill="#032F30" fill-opacity="0.75" stroke="#0C969C" stroke-width="0.8" stroke-opacity="0.5" />
  <circle class="pulse-beacon" cx="776" cy="21.5" r="3.5" fill="#0C969C" />
  <text x="786" y="25.5" class="mono-text" font-size="10" font-weight="700" fill="#E8F6F8" letter-spacing="0.8">ORBIT: NOMINAL // 200 OK</text>

  <!-- ================= DEVELOPER TITLE & EMBLEM ================= -->
  <!-- High-Tech Cosmic Emblem -->
  <g transform="translate(118, 62)">
    <rect width="60" height="60" rx="14" fill="#032F30" fill-opacity="0.7" stroke="#0C969C" stroke-width="1.2" stroke-opacity="0.7" />
    <rect x="4" y="4" width="52" height="52" rx="10" fill="#021514" fill-opacity="0.85" />
    <!-- Planetary Orbit behind monogram -->
    <ellipse cx="30" cy="30" rx="28" ry="10" transform="rotate(-30 30 30)" fill="none" stroke="#6BA3BE" stroke-width="0.8" stroke-dasharray="2,3" stroke-opacity="0.7" />
    <text x="30" y="37" text-anchor="middle" class="mono-text" font-size="18" font-weight="800" fill="#0C969C">&lt;AP/&gt;</text>
  </g>

  <!-- Developer Name -->
  <text x="194" y="93" class="sans-text" font-size="34" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5">
    ADITYA PANIGRAHI
  </text>

  <!-- Role Subtitle -->
  <text x="196" y="116" class="mono-text" font-size="12" font-weight="600" fill="#6BA3BE" letter-spacing="1.2">
    FULL-STACK ARCHITECT <tspan fill="#0C969C">//</tspan> SYSTEMS &amp; C++ <tspan fill="#0C969C">//</tspan> HIGH-PERFORMANCE COMPUTING
  </text>

  <!-- ================= CELESTIAL CODE CONSOLE ================= -->
  <g transform="translate(42, 142)">
    <!-- Terminal Background with Subtle Cosmic Glass Blur -->
    <rect width="866" height="114" rx="12" fill="#021413" fill-opacity="0.88" stroke="#0A7075" stroke-width="1" stroke-opacity="0.38" />

    <!-- Terminal Command 1 -->
    <text x="20" y="32" class="mono-text" font-size="13" font-weight="500">
      <tspan fill="#0C969C" font-weight="700">❯</tspan>
      <tspan fill="#6BA3BE"> const</tspan>
      <tspan fill="#E8F6F8"> engineer </tspan>
      <tspan fill="#6BA3BE">=</tspan>
      <tspan fill="#E8F6F8"> { </tspan>
      <tspan fill="#6BA3BE">core:</tspan>
      <tspan fill="#94E2D5"> "Full-Stack Web &amp; Scalable Systems"</tspan>
      <tspan fill="#E8F6F8">, </tspan>
      <tspan fill="#6BA3BE">engine:</tspan>
      <tspan fill="#94E2D5"> "C++ / React / Node / SQL"</tspan>
      <tspan fill="#E8F6F8"> };</tspan>
    </text>

    <!-- Terminal Command 2 -->
    <text x="20" y="60" class="mono-text" font-size="13" font-weight="500">
      <tspan fill="#0C969C" font-weight="700">❯</tspan>
      <tspan fill="#6BA3BE"> sys.mission</tspan>
      <tspan fill="#6BA3BE">:</tspan>
      <tspan fill="#94E2D5"> "Architecting high-performance web systems &amp; low-latency algorithmic solutions."</tspan>
    </text>

    <!-- Terminal Command 3 with Blinking Cursor -->
    <text x="20" y="88" class="mono-text" font-size="13" font-weight="500">
      <tspan fill="#0C969C" font-weight="700">❯</tspan>
      <tspan fill="#E8F6F8"> git push origin main </tspan>
      <tspan fill="#6BA3BE">--release=</tspan><tspan fill="#94E2D5">"production-grade-software"</tspan>
      <tspan class="cursor-blink" fill="#0C969C" font-weight="800"> █</tspan>
    </text>
  </g>

  <!-- ================= TELEMETRY CHIPS STRIP ================= -->
  <g transform="translate(42, 276)">
    <!-- Chip 1: Architecture -->
    <g transform="translate(0, 0)">
      <rect width="186" height="28" rx="8" fill="#032F30" fill-opacity="0.55" stroke="#0A7075" stroke-width="0.8" stroke-opacity="0.45" />
      <text x="93" y="18" text-anchor="middle" class="mono-text" font-size="11" font-weight="600" fill="#E8F6F8" letter-spacing="0.5">
        SYSTEM ARCHITECTURE
      </text>
    </g>

    <!-- Chip 2: Algorithms -->
    <g transform="translate(198, 0)">
      <rect width="176" height="28" rx="8" fill="#032F30" fill-opacity="0.55" stroke="#0A7075" stroke-width="0.8" stroke-opacity="0.45" />
      <text x="88" y="18" text-anchor="middle" class="mono-text" font-size="11" font-weight="600" fill="#E8F6F8" letter-spacing="0.5">
        C++ &amp; ALGORITHMS
      </text>
    </g>

    <!-- Chip 3: Full Stack -->
    <g transform="translate(386, 0)">
      <rect width="190" height="28" rx="8" fill="#032F30" fill-opacity="0.55" stroke="#0A7075" stroke-width="0.8" stroke-opacity="0.45" />
      <text x="95" y="18" text-anchor="middle" class="mono-text" font-size="11" font-weight="600" fill="#E8F6F8" letter-spacing="0.5">
        FULL-STACK PLATFORMS
      </text>
    </g>

    <!-- Chip 4: API & DB Design -->
    <g transform="translate(588, 0)">
      <rect width="170" height="28" rx="8" fill="#032F30" fill-opacity="0.55" stroke="#0A7075" stroke-width="0.8" stroke-opacity="0.45" />
      <text x="85" y="18" text-anchor="middle" class="mono-text" font-size="11" font-weight="600" fill="#E8F6F8" letter-spacing="0.5">
        API &amp; DATABASE DESIGN
      </text>
    </g>

    <!-- Chip 5: Status -->
    <g transform="translate(770, 0)">
      <rect width="96" height="28" rx="8" fill="#032F30" fill-opacity="0.55" stroke="#0C969C" stroke-width="0.9" stroke-opacity="0.7" />
      <text x="48" y="18" text-anchor="middle" class="mono-text" font-size="11" font-weight="700" fill="#0C969C" letter-spacing="0.6">
        ONLINE ➔
      </text>
    </g>
  </g>
</svg>
